version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # Pinned on purpose; see "Known issues" in README.md. Remove with the pin.
    ignore:
      - dependency-name: sqlalchemy
        versions: [">=2.1"]
      - dependency-name: sqlglot
        versions: [">=30.18"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/etl, /orchestration, /kafka]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
