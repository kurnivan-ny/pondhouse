name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff==0.17.3
          ruff check --output-format=github etl orchestration transformations

      - name: Hadolint
        run: |
          for f in etl/Dockerfile orchestration/Dockerfile kafka/Dockerfile.connect; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < "$f"
            echo "::endgroup::"
          done

      - name: Compose config is valid for every profile
        run: |
          cp .env.example .env
          docker compose --profile cdc --profile tools --profile monitoring --profile governance config -q

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: pondhouse
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements*.txt

      - name: Install dependencies
        run: pip install -r etl/requirements-dev.txt

      - name: Pytest (ClickHouse parity tests must run, not skip)
        working-directory: etl
        env:
          REQUIRE_CLICKHOUSE: "1"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: pondhouse
        run: python -m pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: etl
            context: etl
            file: etl/Dockerfile
          - name: dagster
            context: .
            file: orchestration/Dockerfile
          - name: connect
            context: kafka
            file: kafka/Dockerfile.connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: pondhouse-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Dagster definitions load
        if: matrix.name == 'dagster'
        run: docker run --rm --network none pondhouse-dagster:ci python -c "import repo.definitions"

      # Report only: known findings exist today. Make this blocking (--exit-code 1)
      # once the dependency upgrades land.
      - name: Trivy scan (report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress pondhouse-${{ matrix.name }}:ci

  # Report only for the same reason as Trivy: pip-audit reports known advisories
  # in the pinned dependencies today, so it warns instead of failing. Make it
  # exit non-zero after the upgrades.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          status=0
          pip-audit -r etl/requirements.txt || status=1
          pip-audit -r orchestration/requirements.txt || status=1
          if [ "$status" -ne 0 ]; then
            echo "::warning title=pip-audit::Known vulnerabilities in pinned dependencies (report only, see this job's log)"
          fi
