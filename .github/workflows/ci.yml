name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff==0.17.3
          ruff check --output-format=github etl orchestration

      - name: Hadolint
        run: |
          for f in etl/Dockerfile orchestration/Dockerfile kafka/Dockerfile.connect; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < "$f"
            echo "::endgroup::"
          done

      - name: Compose config is valid for every profile
        run: |
          cp .env.example .env
          docker compose --profile cdc --profile tools --profile monitoring --profile governance config -q

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: pondhouse
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install uv==0.13.7
          uv sync --frozen

      - name: Pytest (ClickHouse parity tests must run, not skip)
        working-directory: etl
        env:
          REQUIRE_CLICKHOUSE: "1"
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: pondhouse
        run: uv run --frozen python -m pytest tests/ -q

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: End-to-end pipeline
        run: bash scripts/smoke_test.sh

  smoke-cdc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: End-to-end CDC path
        run: bash scripts/smoke_cdc.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: etl
            context: .
            file: etl/Dockerfile
          - name: dagster
            context: .
            file: orchestration/Dockerfile
          - name: connect
            context: kafka
            file: kafka/Dockerfile.connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: pondhouse-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Dagster definitions load
        if: matrix.name == 'dagster'
        run: docker run --rm --network none pondhouse-dagster:ci python -c "import repo.definitions"

      # Blocking for etl and dagster, which have no findings. Report only for connect:
      # its findings are libraries bundled in the latest Debezium and Aiven releases.
      - name: Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --exit-code ${{ matrix.name == 'connect' && '0' || '1' }} pondhouse-${{ matrix.name }}:ci

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install uv==0.13.7 pip-audit==2.10.1
          uv export --frozen --no-dev --all-extras --format requirements-txt -o requirements.lock
          pip-audit --require-hashes --disable-pip -r requirements.lock
