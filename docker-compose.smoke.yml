# Overlay for scripts/smoke_*.sh: no published ports, so the smoke tests can run
# next to a live stack on the same machine.
services:
  rustfs:
    ports: !reset []
  clickhouse:
    ports: !reset []
  postgres:
    ports: !reset []
  dagster-webserver:
    ports: !reset []
  kafka:
    ports: !reset []
  connect:
    ports: !reset []
