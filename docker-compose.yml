# ============================================================================
# pondhouse — lean lakehouse platform
#
#   storage:  RustFS (S3) + Delta Lake
#   ingest:   Sling (batch) · Debezium -> Kafka(KRaft) -> Aiven S3 sink (CDC)
#   compute:  DuckDB via Ibis
#   serving:  ClickHouse    · viz: Metabase    · orchestration: Dagster
#   monitor:  Beszel        · governance: OpenMetadata
#
# Quickstart:
#   docker compose up -d                       # core stack
#   docker compose --profile cdc up -d         # + Kafka + Kafka Connect (Debezium/Aiven)
#   docker compose --profile monitoring up -d  # + Beszel (hub + agent)
#   docker compose --profile governance up -d  # + OpenMetadata + Elasticsearch
# ============================================================================

name: pondhouse

services:

  # ---------------- Storage: RustFS (S3) ----------------
  rustfs:
    mem_limit: 512m
    restart: unless-stopped
    image: rustfs/rustfs:1.0.4
    environment:
      # rustfs admin credentials (minio-compatible)
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9000:9000"    # S3 API
      - "${BIND_ADDR:-127.0.0.1}:9001:9001"    # web console
    volumes:
      - rustfs-data:/data

  createbuckets:
    image: rustfs/rc:v0.1.37
    depends_on:
      - rustfs
    env_file: .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        rc alias set rustfs http://rustfs:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" -q
        until rc bucket create --ignore-existing rustfs/lake; do
          echo "waiting for rustfs..."; sleep 2;
        done
        rc bucket create --ignore-existing rustfs/cdc-landing
        echo "buckets ready"
    restart: "no"

  # ---------------- Kafka (KRaft mode, no ZooKeeper; profile: cdc) ----------------
  kafka:
    mem_limit: 1g
    image: apache/kafka:4.0.0
    profiles: ["cdc"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # CLUSTER_ID: Generate with `uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-' | head -c 22`
      # Or set KAFKA_CLUSTER_ID in .env for multi-instance deployments
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:29092:29092"  # host access (from WSL: localhost:29092)
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ------------- Kafka Connect: Debezium + Aiven S3 sink (profile: cdc) -------------
  connect:
    mem_limit: 1280m
    build:
      context: ./kafka
      dockerfile: Dockerfile.connect
    profiles: ["cdc"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      HEAP_OPTS: -Xms256m -Xmx768m
      GROUP_ID: pondhouse-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      # Connector JSONs reference these as ${env:NAME}, so no secret is in the repo.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  # ---------------- ClickHouse (serving layer) ----------------
  clickhouse:
    mem_limit: 1536m
    restart: unless-stopped
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      # Read by serving/config.d/rustfs_s3.xml
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8123:8123"    # HTTP (Metabase / Ibis connect here)
      - "${BIND_ADDR:-127.0.0.1}:9009:9000"    # native TCP (9000 is taken by RustFS)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./serving/initdb:/docker-entrypoint-initdb.d:ro
      - ./serving/config.d:/etc/clickhouse-server/config.d:ro
      # A single file: the image writes its own default-user.xml to this directory.
      - ./serving/users.d/named_collections.xml:/etc/clickhouse-server/users.d/named_collections.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # -------- Postgres: Dagster/OM/Airflow storage + demo CDC source --------
  postgres:
    mem_limit: 512m
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by orchestration/initdb/01_dbs.sh on first boot
      OM_DB_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
    command: postgres -c wal_level=logical
    ports:
      # Host port is configurable so the stack does not collide with another
      # local Postgres. In-network services always use 5432.
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./orchestration/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------- Metabase ----------------
  metabase:
    mem_limit: 1536m
    restart: unless-stopped
    image: metabase/metabase:v0.65.3.7
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      # Metabase's old H2 database, kept for scripts/migrate_metabase_h2.sh.
      - metabase-data:/metabase-data
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      JAVA_OPTS: -Xmx1g
    depends_on:
      metabase-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5m

  # Creates Metabase's database. A separate step, not initdb, because initdb only
  # runs on a brand-new Postgres volume.
  metabase-db:
    image: postgres:16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint:
      - /bin/sh
      - -c
      - psql -Atc "SELECT 1 FROM pg_database WHERE datname = 'metabase'" | grep -q 1 || createdb metabase
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------- Dagster ----------------
  dagster-webserver:
    mem_limit: 1536m
    restart: unless-stopped
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3001 -w workspace.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/server_info', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 2m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    env_file: .env
    environment: &etl-runtime-env
      # The assets call the etl/ modules, which address the other services by
      # their in-network names.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ETL_DB: demo
      S3_ENDPOINT: http://rustfs:9000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      INGESTION_MODE: ${INGESTION_MODE:-snapshot}
    volumes:
      - dagster-storage:/opt/dagster/dagster_home/storage
    depends_on:
      postgres:
        condition: service_healthy

  dagster-daemon:
    mem_limit: 1536m
    restart: unless-stopped
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    command: dagster-daemon run -w workspace.yaml
    env_file: .env
    environment: *etl-runtime-env
    volumes:
      - dagster-storage:/opt/dagster/dagster_home/storage
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------- Medallion ETL runner ----------------
  # Runs the pipeline inside the compose network, so it addresses the other
  # services by name (postgres / rustfs / clickhouse) rather than localhost.
  #   docker compose --profile tools run --rm etl python etl.py
  etl:
    mem_limit: 1g
    build:
      context: .
      dockerfile: etl/Dockerfile
      target: dev
    image: pondhouse-etl:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      ETL_DB: demo
      S3_ENDPOINT: http://rustfs:9000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      INGESTION_MODE: ${INGESTION_MODE:-snapshot}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ---------------- Monitoring: Beszel (profile: monitoring) ----------------
  beszel:
    image: henrygd/beszel:0.21.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8090:8090"    # web UI
    volumes:
      - beszel-data:/beszel_data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the hub reach the agent

  beszel-agent:
    image: henrygd/beszel-agent:0.21.1
    profiles: ["monitoring"]
    restart: unless-stopped
    network_mode: host   # accurate host CPU/RAM/net/disk stats
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_AGENT_KEY}   # public key from Beszel UI -> Add System

  # ------------- Governance: OpenMetadata (profile: governance) -------------
  # Adapted from the official OpenMetadata 1.13.3 Postgres compose; uses the
  # shared postgres service (users/dbs in orchestration/initdb/01_dbs.sql).
  # Requires vm.max_map_count=262144 on the host (see README -> Governance).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: ["governance"]
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10

  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:${OM_VERSION}
    profiles: ["governance"]
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment: &om-env
      # database (shared pondhouse postgres)
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
      OM_DATABASE: openmetadata_db
      # elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_USER: ""
      ELASTICSEARCH_PASSWORD: ""
      SEARCH_TYPE: elasticsearch
      # pipeline service (airflow)
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # auth — basic. OM_FERNET_KEY must be set in .env for this profile
      AUTHENTICATION_PROVIDER: basic
      AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
      AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      JWT_ISSUER: open-metadata.org
      JWT_KEY_ID: Gb389a-9f76-gdjs-a92j-0242bk94356
      RSA_PUBLIC_KEY_FILE_PATH: ./conf/public_key.der
      RSA_PRIVATE_KEY_FILE_PATH: ./conf/private_key.der
      FERNET_KEY: ${OM_FERNET_KEY:-}
      SECRET_MANAGER: db
      OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:${OM_VERSION}
    profiles: ["governance"]
    restart: unless-stopped
    environment: *om-env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8585:8585"    # UI + API  (login: admin@open-metadata.org / admin)
      - "${BIND_ADDR:-127.0.0.1}:8586:8586"    # admin / healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]

  ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:${OM_VERSION}
    profiles: ["governance"]
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: postgres
      DB_PORT: "5432"
      AIRFLOW_DB: airflow_db
      DB_USER: airflow_user
      DB_SCHEME: postgresql+psycopg2
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
    entrypoint: /bin/bash
    command: ["/opt/airflow/ingestion_dependency.sh"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"    # Airflow UI (admin / admin)
    volumes:
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      openmetadata-server:
        condition: service_started

volumes:
  rustfs-data:
  kafka-data:
  clickhouse-data:
  postgres-data:
  metabase-data:
  dagster-storage:
  beszel-data:
  es-data:
  ingestion-volume-dag-airflow:
  ingestion-volume-dags:
  ingestion-volume-tmp:
