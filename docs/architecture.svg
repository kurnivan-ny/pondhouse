<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Pondhouse lakehouse architecture</title>
  <desc id="desc">Postgres POS source flows through Sling ingestion into a Delta medallion on RustFS (bronze, silver, gold, mart) computed with Ibis on DuckDB, then served to ClickHouse and Metabase, orchestrated by Dagster.</desc>

  <style>
    .lbl   { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub   { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tier  { font: 700 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
    .note  { font: 11px ui-sans-serif, system-ui, sans-serif; }
    .flow  { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .card  { rx: 10; ry: 10; stroke-width: 1.5; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="470" fill="#ffffff"/>

  <!-- Lane: lake -->
  <rect x="196" y="96" width="590" height="150" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text x="206" y="116" class="tier" fill="#64748b">DELTA LAKE ON RUSTFS (S3)</text>

  <!-- Source -->
  <rect x="24" y="140" width="140" height="62" class="card" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="94" y="166" class="lbl" fill="#1e3a8a" text-anchor="middle">Postgres</text>
  <text x="94" y="184" class="sub" fill="#3b82f6" text-anchor="middle">pos.* (OLTP)</text>

  <!-- Ingestion -->
  <rect x="212" y="140" width="128" height="62" class="card" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="276" y="166" class="lbl" fill="#155e75" text-anchor="middle">ingestion</text>
  <text x="276" y="184" class="sub" fill="#0891b2" text-anchor="middle">Sling → parquet</text>

  <!-- Bronze -->
  <rect x="360" y="140" width="112" height="62" class="card" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="416" y="166" class="lbl" fill="#9a3412" text-anchor="middle">bronze</text>
  <text x="416" y="184" class="sub" fill="#c2410c" text-anchor="middle">+ _ingested_at</text>

  <!-- Silver -->
  <rect x="492" y="140" width="112" height="62" class="card" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="548" y="163" class="lbl" fill="#334155" text-anchor="middle">silver</text>
  <text x="548" y="181" class="sub" fill="#64748b" text-anchor="middle">clean · dedupe</text>
  <text x="548" y="195" class="sub" fill="#64748b" text-anchor="middle">translate</text>

  <!-- Gold -->
  <rect x="624" y="140" width="112" height="62" class="card" fill="#fefce8" stroke="#fde68a"/>
  <text x="680" y="163" class="lbl" fill="#854d0e" text-anchor="middle">gold</text>
  <text x="680" y="181" class="sub" fill="#a16207" text-anchor="middle">dim_* + fact</text>
  <text x="680" y="195" class="sub" fill="#a16207" text-anchor="middle">star schema</text>

  <!-- Mart -->
  <rect x="624" y="286" width="112" height="62" class="card" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="680" y="312" class="lbl" fill="#166534" text-anchor="middle">mart</text>
  <text x="680" y="330" class="sub" fill="#16a34a" text-anchor="middle">3 data marts</text>

  <!-- ClickHouse -->
  <rect x="810" y="140" width="146" height="62" class="card" fill="#fef2f2" stroke="#fecaca"/>
  <text x="883" y="166" class="lbl" fill="#991b1b" text-anchor="middle">ClickHouse</text>
  <text x="883" y="184" class="sub" fill="#dc2626" text-anchor="middle">marts.* :8123</text>

  <!-- Metabase -->
  <rect x="810" y="286" width="146" height="62" class="card" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="883" y="312" class="lbl" fill="#6b21a8" text-anchor="middle">Metabase</text>
  <text x="883" y="330" class="sub" fill="#9333ea" text-anchor="middle">:3000 · DBeaver</text>

  <!-- Dagster -->
  <rect x="212" y="378" width="524" height="52" class="card" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="474" y="399" class="lbl" fill="#334155" text-anchor="middle">Dagster — asset graph + 5-minute schedule</text>
  <text x="474" y="417" class="sub" fill="#64748b" text-anchor="middle">sling_ingestion → bronze_layer → transform_layer → clickhouse_marts</text>

  <!-- Flows -->
  <path class="flow" d="M 164 171 H 206"/>
  <path class="flow" d="M 340 171 H 354"/>
  <path class="flow" d="M 472 171 H 486"/>
  <path class="flow" d="M 604 171 H 618"/>
  <path class="flow" d="M 736 171 H 804"/>
  <path class="flow" d="M 680 202 V 280"/>
  <path class="flow" d="M 736 317 H 804"/>
  <path class="flow" d="M 883 202 V 280"/>

  <!-- Dagster orchestration ties -->
  <path d="M 276 378 V 212" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 416 378 V 212" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 548 378 V 212" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path d="M 700 378 V 358" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Engine annotation -->
  <text x="474" y="264" class="note" fill="#64748b" text-anchor="middle">one Ibis expression · DuckDB engine · verified identical on ClickHouse</text>

  <text x="94" y="222" class="sub" fill="#94a3b8" text-anchor="middle">:5433</text>
  <text x="276" y="222" class="sub" fill="#94a3b8" text-anchor="middle">:9000</text>
</svg>
