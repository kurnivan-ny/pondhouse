<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-labelledby="t d">
  <title id="t">Gold layer star schema</title>
  <desc id="d">fact_sales at the centre joins to dim_customer, dim_product, dim_store and dim_date on their surrogate keys.</desc>

  <style>
    .tbl  { font: 700 12px ui-sans-serif, system-ui, sans-serif; }
    .col  { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .pk   { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rel  { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .card { rx: 8; ry: 8; stroke-width: 1.5; }
  </style>

  <rect width="820" height="460" fill="#ffffff"/>

  <!-- fact_sales (centre) -->
  <rect x="316" y="166" width="188" height="128" class="card" fill="#fffbeb" stroke="#fbbf24"/>
  <rect x="316" y="166" width="188" height="26" rx="8" fill="#fbbf24"/>
  <text x="410" y="184" class="tbl" fill="#451a03" text-anchor="middle">fact_sales</text>
  <text x="330" y="210" class="pk" fill="#92400e">item_key</text>
  <text x="330" y="226" class="col" fill="#78716c">customer_key · product_key</text>
  <text x="330" y="242" class="col" fill="#78716c">store_key · date_key</text>
  <text x="330" y="262" class="col" fill="#57534e">quantity, unit_price</text>
  <text x="330" y="278" class="col" fill="#57534e">line_amount</text>

  <!-- dim_customer (left) -->
  <rect x="40" y="60" width="176" height="96" class="card" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="40" y="60" width="176" height="24" rx="8" fill="#93c5fd"/>
  <text x="128" y="77" class="tbl" fill="#1e3a8a" text-anchor="middle">dim_customer</text>
  <text x="54" y="102" class="pk" fill="#1d4ed8">customer_key</text>
  <text x="54" y="120" class="col" fill="#475569">full_name, email</text>
  <text x="54" y="138" class="col" fill="#475569">country, signup_date</text>

  <!-- dim_product (right) -->
  <rect x="604" y="60" width="176" height="96" class="card" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="604" y="60" width="176" height="24" rx="8" fill="#86efac"/>
  <text x="692" y="77" class="tbl" fill="#14532d" text-anchor="middle">dim_product</text>
  <text x="618" y="102" class="pk" fill="#15803d">product_key</text>
  <text x="618" y="120" class="col" fill="#475569">product_name</text>
  <text x="618" y="138" class="col" fill="#475569">category, unit_price</text>

  <!-- dim_store (left bottom) -->
  <rect x="40" y="304" width="176" height="96" class="card" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="40" y="304" width="176" height="24" rx="8" fill="#fca5a5"/>
  <text x="128" y="321" class="tbl" fill="#7f1d1d" text-anchor="middle">dim_store</text>
  <text x="54" y="346" class="pk" fill="#b91c1c">store_key</text>
  <text x="54" y="364" class="col" fill="#475569">store_name, city</text>
  <text x="54" y="382" class="col" fill="#475569">country</text>

  <!-- dim_date (right bottom) -->
  <rect x="604" y="304" width="176" height="96" class="card" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="604" y="304" width="176" height="24" rx="8" fill="#d8b4fe"/>
  <text x="692" y="321" class="tbl" fill="#581c87" text-anchor="middle">dim_date</text>
  <text x="618" y="346" class="pk" fill="#7e22ce">date_key</text>
  <text x="618" y="364" class="col" fill="#475569">transaction_date</text>
  <text x="618" y="382" class="col" fill="#475569">year, month, day</text>

  <!-- relations -->
  <path class="rel" d="M 216 116 C 268 126, 280 178, 316 196"/>
  <path class="rel" d="M 604 116 C 552 126, 540 178, 504 196"/>
  <path class="rel" d="M 216 344 C 268 334, 280 282, 316 264"/>
  <path class="rel" d="M 604 344 C 552 334, 540 282, 504 264"/>

  <text x="410" y="430" class="col" fill="#94a3b8" text-anchor="middle">gold layer — Delta on RustFS, exposed to ClickHouse as marts.*</text>
</svg>
