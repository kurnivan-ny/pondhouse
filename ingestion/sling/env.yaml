# Sling connections — ${VARS} resolve from the environment (.env)
# Use inside the sling container: docker compose --profile tools exec sling sling run ...
# or copy to ~/.sling/env.yaml for local runs.
connections:

  # Demo source DB (postgres service in docker-compose.yml)
  DEMO_PG:
    type: postgres
    host: postgres
    port: 5432
    user: pondhouse
    password: ${POSTGRES_PASSWORD}
    database: demo

  # Lake storage (RustFS — sling uses path-style automatically when endpoint is set)
  RUSTFS:
    type: s3
    bucket: lake
    endpoint: http://rustfs:9000
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    region: us-east-1
