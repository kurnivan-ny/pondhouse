connections:
  DEMO_PG:
    type: postgres
    host: postgres
    port: 5432
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    database: demo
  RUSTFS:
    type: s3
    bucket: lake
    endpoint: http://rustfs:9000
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
