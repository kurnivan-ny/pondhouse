# Batch replication: demo Postgres (pos) -> ingestion parquet on RustFS
# Run: sling run --home-dir /sling -r replications/demo-to-lake.yaml
source: DEMO_PG
target: RUSTFS

defaults:
  mode: full-refresh
  object: ingestion/{stream_table}.parquet

streams:
  pos.*:

env:
  # Otherwise a source table that becomes empty keeps its old parquet, and the pipeline
  # goes on serving the deleted rows. An empty file fails the has_rows check instead.
  SLING_ALLOW_EMPTY: true
