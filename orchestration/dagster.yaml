# Dagster instance config. Copied into $DAGSTER_HOME by orchestration/Dockerfile.
storage:
  postgres:
    postgres_db:
      hostname: postgres
      port: 5432
      db_name: dagster
      username:
        env: POSTGRES_USER
      password:
        env: POSTGRES_PASSWORD

# One pipeline run at a time: a slow run must not overlap the next schedule tick,
# since every run rewrites the same Delta tables.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/dagster_home/storage/compute_logs

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/dagster_home/storage/artifacts

telemetry:
  enabled: false
