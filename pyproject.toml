[project]
name = "pondhouse"
version = "0.1.0"
description = "A lean, fully open-source lakehouse platform"
requires-python = "==3.12.*"
# The pipeline itself. Exact versions live in uv.lock.
dependencies = [
    "apscheduler>=3.11",
    "deltalake>=1.6",
    "duckdb>=2.0",
    "ibis-framework[duckdb]>=12.0",
    "psycopg2-binary>=2.9",
    "pyarrow>=26.0",
    "sling>=1.6",
    # sqlglot 30.18 reads Drop's table from `tables`, but Ibis 12.0 passes `this`, so
    # every Ibis DROP renders with no name (see "Known issues" in README.md).
    "sqlglot<30.18",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.13",
    "dagster-postgres>=0.29",
    "dagster-webserver>=1.13",
    # SQLAlchemy 2.1 makes psycopg v3 the default Postgres driver, but dagster-postgres
    # needs psycopg2 (see "Known issues" in README.md).
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    # ClickHouse backend for the cross-engine parity tests.
    "ibis-framework[clickhouse]>=12.0",
    "pytest>=9.0",
]

[tool.uv]
# An application, not a library: scripts run from etl/, nothing is installed.
package = false
